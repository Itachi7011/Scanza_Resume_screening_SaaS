# ==============================================================================
# Scanza — local/dev orchestration
#
# What this does: starts your 2 Node microservices + the Python extraction
# worker, all talking to each other on one Docker network. Your PostgreSQL
# database is REMOTE (Neon/Supabase/etc.), so it is NOT started here — each
# service just needs DATABASE_URL pointed at it inside its own .env file.
#
# How to use:
#   1. Copy every services/*/.env.example to services/*/.env and fill values.
#   2. Run:  docker compose up --build
#   3. auth-service    -> http://localhost:5001
#      main-service    -> http://localhost:5002
#      resume-worker   -> http://localhost:8000 (internal, main-service calls it)
#
# You do NOT need Docker for local dev if you prefer running `npm run dev`
# in each service folder directly — Docker is just for convenience/parity
# with production.
# ==============================================================================

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: scanza-auth-service
    ports:
      - "5001:5001"
    env_file:
      - services/auth-service/.env
    networks:
      - scanza-network
    restart: unless-stopped

  main-service:
    build:
      context: .
      dockerfile: services/main-service/Dockerfile
    container_name: scanza-main-service
    ports:
      - "5002:5002"
    env_file:
      - services/main-service/.env
    environment:
      # Inside Docker, main-service reaches the worker by its service name,
      # not "localhost". This overrides whatever is in the .env file.
      - RESUME_WORKER_URL=http://resume-worker:8000
    depends_on:
      - resume-worker
    networks:
      - scanza-network
    restart: unless-stopped

  resume-worker:
    build:
      context: .
      dockerfile: services/resume-worker/Dockerfile
    container_name: scanza-resume-worker
    ports:
      - "8000:8000"
    env_file:
      - services/resume-worker/.env
    networks:
      - scanza-network
    restart: unless-stopped

networks:
  scanza-network:
    driver: bridge
